items:
  - id: h003
    title: wire trace-task into doob
    description: >
      Explore using TaskRegistry as the storage backend for doob todos.
      The serialization contract and dependency graph are already compatible.
      Done: added tracers_adapter (Task<->Todo conversions) and
      DoobCheckpointStore (bridges sync CheckpointStore to doob's async
      TodoRepository via block_on) in doob-core, plus a shared
      CheckpointStore conformance suite in tracers-task applied to both
      FileCheckpointStore and DoobCheckpointStore. TraceErr also gained
      a miette::Diagnostic derive as a prerequisite. Work lives on
      doob's feat/tracers-task-checkpoint-store branch (not yet merged
      or pushed) plus two commits on tracers main (9e20ff9, 66b12e1).
    priority: P2
    status: done
    files:
      - crates/task/src/registry.rs
      - crates/task/src/checkpoint/conformance.rs
      - crates/core/src/error.rs

  - id: h005
    title: trace-cli — checkpoint inspector
    description: >
      A doob-style CLI for inspecting .trace.json checkpoint files.
      Commands: list, show <task-id>, chain <trace-ref>, diff <ref1> <ref2>.
      Done: shipped as crates/cli (package trace-cli, binary `trace`). All four
      commands, each with --json. Queries are public library API so in-process
      callers need not shell out; checkpoints are read through CheckpointStore
      rather than std::fs. Integration tests drive the real binary.
    priority: P3
    status: done
    files:
      - crates/cli/

  - id: h008
    title: implement the actionable FEATURES.md proposals
    description: >
      Done: step cost ledger (#3), pausable/resumable traces (#5), contracts
      (#6), TraceGraph (#7), and speculate_race (#8) are all implemented, with
      each proposal's open design questions resolved in the code and recorded
      in CLAUDE.md. Typed trust (#1), confidence decay (#2), and deterministic
      replay (#4) remain proposals — they have real open questions rather than
      just unwritten code.
    priority: P2
    status: done
    files:
      - docs/ideas/FEATURES.md

  - id: h006
    title: thread-parallel join_all / speculate
    description: >
      Current join_all and speculate use futures::future::join_all —
      concurrent on one task, not distributed across OS threads. A
      tokio::spawn-based variant needs 'static agents (Arc<dyn Agent<...>>
      throughout) rather than borrowed &A. Split out of h002 since it's a
      bigger API change than the registry-resolution work.
    priority: P2
    status: open
    files:
      - crates/runtime/src/join.rs
      - crates/runtime/src/speculate.rs

  - id: h007
    title: shared step budget across concurrent branches
    description: >
      AgentContext::budget is per-run only. speculate and join_all give
      each candidate/input its own independent budget. A SharedBudget
      (e.g. Arc<AtomicUsize>) that caps total steps across all concurrent
      branches needs a new optional field threaded through AgentContext
      and record_step(). Split out of h002 — deferred, not silently
      assumed to already work.
    priority: P3
    status: open
    files:
      - crates/agent/src/context.rs

log:
  - session: 3
    date: 20260731.020000
    summary: >
      added trace-runtime crate — AgentRegistry<I,O>, run_with_escalation
      (delegation-resolution loop with max_hops), join_all (concurrent
      fan-out), speculate (confidence-based winner selection with
      rejected Branches). Refactored trace-agent's spawn/delegate to
      accept `A: Agent + ?Sized` so the registry can dispatch through
      dyn Agent without duplicating hook-evaluation logic. 5 unit tests +
      4 doctests, all passing; caught and fixed a real tie-breaking bug
      (Iterator::max_by returns the LAST element on ties, not the first)
      via the unit tests, not by inspection. Zero clippy warnings, fmt
      clean, verified via two independent from-scratch clone rebuilds.
      Closed h002 and h004; split their unimplemented scope into h006
      (thread parallelism) and h007 (shared budget).
    commits: []

