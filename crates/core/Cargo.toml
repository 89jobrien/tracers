[package]
name        = "trace-lang-core"
description = "Core Trace<T> type — reasoning provenance as a first-class value"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace    = true
keywords.workspace    = true
categories.workspace  = true
rust-version.workspace = true

# docs.rs builds with every feature on, so items behind `test-support` (and
# any future feature) appear in the published docs instead of silently
# missing.
[package.metadata.docs.rs]
all-features = true

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
uuid       = { workspace = true }
chrono     = { workspace = true }
thiserror  = { workspace = true }
miette     = { version = "7", features = ["fancy"] }

[dev-dependencies]
# `cargo_bench_support` only — criterion's default features add plotters
# and rayon, which this crate's benches do not use and cargo-deny would
# have to vet for no benefit.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = { workspace = true }

[[bench]]
name    = "trace"
harness = false
