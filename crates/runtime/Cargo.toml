[package]
name        = "tracers-runtime"
description = "Agent registry, delegation resolution, parallel fan-out, and speculative branching for trace::"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
tracers-core  = { path = "../core" }
tracers-agent = { path = "../agent" }
serde         = { workspace = true }
futures       = { workspace = true }
async-trait   = { workspace = true, optional = true }

[dev-dependencies]
tokio       = { workspace = true }
async-trait = { workspace = true }
proptest    = { workspace = true }
# Self-dependency enabling this crate's own `test-support` feature for its
# `tests/` integration binaries — those see the lib as an external consumer
# (cfg(test) does not apply), so `fixtures` needs the feature explicitly.
# Cargo unifies this with the main [dependencies] entry during test builds;
# it does not affect real downstream consumers, who never enable it.
# TODO: needs an explicit `version = "0.1.1"` before the first `cargo
# publish` — a path-only self-dependency has nothing to fall back to once
# `path` is stripped during publish verification.
tracers-runtime = { path = ".", features = ["test-support"] }

[features]
test-support = ["dep:async-trait"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(kani)"] }
