[package]
name        = "trace-lang-agent"
description = "Agent trait, spawn/delegate, and lifecycle escalation hooks for trace::"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace    = true
keywords.workspace    = true
categories.workspace  = true
rust-version.workspace = true

# docs.rs builds with every feature on, so items behind `test-support` (and
# any future feature) appear in the published docs instead of silently
# missing.
[package.metadata.docs.rs]
all-features = true

[dependencies]
trace-lang-core = { version = "0.2.1", path = "../core" }
serde        = { workspace = true }
async-trait  = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true }
proptest = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(kani)"] }
