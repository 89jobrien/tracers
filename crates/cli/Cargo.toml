[package]
name        = "trace-cli"
description = "Inspect trace:: checkpoint files — list, show, chain, and diff task graphs"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace    = true
keywords.workspace    = true
categories.workspace  = true
rust-version.workspace = true

[[bin]]
name = "trace"
path = "src/main.rs"

# docs.rs builds with every feature on, so items behind `test-support` (and
# any future feature) appear in the published docs instead of silently
# missing.
[package.metadata.docs.rs]
all-features = true

[dependencies]
trace-lang-core = { version = "0.2.1", path = "../core" }
trace-lang-task = { version = "0.2.1", path = "../task" }
clap        = { workspace = true }
miette      = { version = "7", features = ["fancy"] }
serde       = { workspace = true }
serde_json  = { workspace = true }
uuid        = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
