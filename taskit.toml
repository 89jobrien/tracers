[workspace]
# root = "/path/to/workspace"  # defaults to Cargo.toml location
crates = [
  { dir = "crates/core", pkg = "trace-lang-core" },
  { dir = "crates/task", pkg = "trace-lang-task" },
  { dir = "crates/agent", pkg = "trace-lang-agent" },
  { dir = "crates/runtime", pkg = "trace-lang-runtime" },
  { dir = "crates/trace-test", pkg = "trace-lang-test" },
  { dir = "crates/cli", pkg = "trace-cli" },
]
# offline_skip = "test(/.*network.*/)"


[[workspace.propagation]]
source = "trace-lang-agent"
dependents = ["trace-lang-runtime"]

[[workspace.propagation]]
source = "trace-lang-core"
dependents = ["trace-lang-task", "trace-lang-agent", "trace-lang-runtime"]

[[workspace.propagation]]
source = "trace-lang-core"
dependents = ["trace-lang-test"]

[[workspace.propagation]]
source = "trace-lang-agent"
dependents = ["trace-lang-test"]

[[workspace.propagation]]
source = "trace-lang-runtime"
dependents = ["trace-lang-test"]

[[workspace.propagation]]
source = "trace-lang-task"
dependents = ["trace-cli"]

[protocol]
# lockfile = "taskit-protocol.lock"

[[protocol.surfaces]]
name = "trace-lang-agent-agent"
path = "crates/agent/src/agent.rs"

[[protocol.surfaces]]
name = "trace-lang-core-error"
path = "crates/core/src/error.rs"

[[protocol.surfaces]]
name = "trace-lang-core-trace"
path = "crates/core/src/trace.rs"

[[protocol.surfaces]]
name = "trace-lang-task-checkpoint"
path = "crates/task/src/checkpoint/mod.rs"

[[protocol.surfaces]]
name = "trace-lang-task-registry"
path = "crates/task/src/registry.rs"

# Budget enforcement: `record_step` is the only thing standing between a
# runaway agent and an unbounded bill.
[[protocol.surfaces]]
name = "trace-lang-agent-context"
path = "crates/agent/src/context.rs"

# Winner selection: CLAUDE.md records that `Iterator::max_by` silently broke
# "first candidate wins ties" here once already, and only a unit test caught
# it. Tracking the file means the next edit to it is at least noticed.
[[protocol.surfaces]]
name = "trace-lang-runtime-speculate"
path = "crates/runtime/src/speculate.rs"

# Coverage enforcement: run `taskit coverage --crate-name <pkg>` to check.
# taskit's [coverage] block only supports one crate at a time, so this stays
# unset here; run per-crate via `taskit coverage --crate-name trace-lang-core`
# (etc.) until a workspace-wide baseline is established.
#
# [coverage]
# crate_name = "my-crate"
# threshold = 80.0

[ci]
cruxfile   = "Cruxfile"
fail_fast  = true

[[ci.steps]]
name = "self-check"
cmd = "self-check"
gate = true

[[ci.steps]]
name = "fmt --check"
cmd = "fmt --check"
gate = true

[[ci.steps]]
name = "lint"
cmd = "lint"
gate = true

[[ci.steps]]
name = "compile-tests"
cmd = "compile-tests"
gate = false

[[ci.steps]]
name = "test"
cmd = "test"
gate = true

[[ci.steps]]
name = "check-deps"
cmd = "check-deps"
gate = true

[[ci.steps]]
name = "check-protocol-drift"
cmd = "check-protocol-drift"
gate = true

# Non-gating on purpose. A benchmark has no pass/fail without a stored
# baseline, and both fuzz targets need nightly plus cargo-fuzz, which not
# every environment running `taskit ci` will have. They earn their place by
# reporting — a target that stops building is a real regression, and 60
# seconds each is enough to catch that.
[[ci.steps]]
name = "bench"
cmd = "bench --crate-name trace-lang-core"
gate = false

[[ci.steps]]
name = "fuzz (trace_roundtrip)"
cmd = "fuzz trace_roundtrip --duration 60"
gate = false

[[ci.steps]]
name = "fuzz (checkpoint_parse)"
cmd = "fuzz checkpoint_parse --duration 60"
gate = false

# Metric thresholds for `taskit inspect`. CLI flags override these.
# max_todo_fixme was 20 while a gm-ideate pass had seeded a TODO marker for
# every open backlog idea. Those are now implemented; what remains are the
# two items CLAUDE.md lists as explicitly deferred (thread-parallel
# join_all/speculate, and a shared step budget), which account for every
# marker left. Lower this again as those close — do not raise it to make a
# new marker fit.
[inspect]
max_clippy_warnings = 0
max_clippy_errors   = 0
max_test_failures   = 0
max_todo_fixme      = 5

# Default retention policy for `taskit clean`. CLI --older-than overrides.
[clean]
older_than = "7d"  # use `cargo sweep`; omit to run `cargo clean`

# Git flow: main -> develop (work) -> staging (integration) -> release (publish) -> main
# develop/staging/release branches now exist (created off main) so `taskit
# flow auto` can run the full pipeline.
[flow]
main = "main"
develop = "develop"
staging = "staging"
release = "release"
# Push main + flow branches to origin after a successful `taskit flow auto`
# (requires taskit >= the feat(flow) push commit; older binaries ignore this).
push = true

[release]
# CHANGELOG.md is generated from conventional commits by git-cliff (see
# cliff.toml). taskit has no changelog hook of its own, so the regeneration
# lives where this repo puts everything taskit cannot chain: `mise run
# changelog`, which `mise run release-check` depends on. Run a version bump
# as `taskit patch && mise run changelog`.
# github_repo = "owner/repo"  # auto-detected from git remote
publish_order = [
  "trace-lang-core",
  "trace-lang-agent",
  "trace-lang-task",
  "trace-lang-runtime",
]
# skip_docs   = false  # skip `cargo doc` before publishing
# allow_dirty = false  # publish with uncommitted changes

[output]
default_format = "sarif"
