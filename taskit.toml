[workspace]
# root = "/path/to/workspace"  # defaults to Cargo.toml location
crates = [
  { dir = "crates/core", pkg = "tracers-core" },
  { dir = "crates/task", pkg = "tracers-task" },
  { dir = "crates/agent", pkg = "tracers-agent" },
  { dir = "crates/runtime", pkg = "tracers-runtime" },
]
# offline_skip = "test(/.*network.*/)"


[[workspace.propagation]]
source = "tracers-agent"
dependents = ["tracers-runtime"]

[[workspace.propagation]]
source = "tracers-core"
dependents = ["tracers-task", "tracers-agent", "tracers-runtime"]

[protocol]
# lockfile = "taskit-protocol.lock"

[[protocol.surfaces]]
name = "tracers-agent-agent"
path = "crates/agent/src/agent.rs"

[[protocol.surfaces]]
name = "tracers-core-error"
path = "crates/core/src/error.rs"

[[protocol.surfaces]]
name = "tracers-core-trace"
path = "crates/core/src/trace.rs"

[[protocol.surfaces]]
name = "tracers-task-checkpoint"
path = "crates/task/src/checkpoint/mod.rs"

[[protocol.surfaces]]
name = "tracers-task-registry"
path = "crates/task/src/registry.rs"

# Coverage enforcement: run `taskit coverage --crate-name <pkg>` to check.
# taskit's [coverage] block only supports one crate at a time, so this stays
# unset here; run per-crate via `taskit coverage --crate-name tracers-core`
# (etc.) until a workspace-wide baseline is established.
#
# [coverage]
# crate_name = "my-crate"
# threshold = 80.0

[ci]
cruxfile   = "Cruxfile"
fail_fast  = true

[[ci.steps]]
name = "self-check"
cmd = "self-check"
gate = true

[[ci.steps]]
name = "fmt --check"
cmd = "fmt --check"
gate = true

[[ci.steps]]
name = "lint"
cmd = "lint"
gate = true

[[ci.steps]]
name = "compile-tests"
cmd = "compile-tests"
gate = false

[[ci.steps]]
name = "test"
cmd = "test"
gate = true

[[ci.steps]]
name = "check-deps"
cmd = "check-deps"
gate = true

[[ci.steps]]
name = "check-protocol-drift"
cmd = "check-protocol-drift"
gate = true

# Metric thresholds for `taskit inspect`. CLI flags override these.
# Repo is currently at zero clippy warnings/errors and zero TODO/FIXME markers
# (verified via `cargo clippy --workspace` and a full-workspace grep) — pin at
# zero so any regression is caught immediately.
[inspect]
max_clippy_warnings = 0
max_clippy_errors   = 0
max_test_failures   = 0
max_todo_fixme      = 0

# Default retention policy for `taskit clean`. CLI --older-than overrides.
[clean]
older_than = "7d"  # use `cargo sweep`; omit to run `cargo clean`

# Git flow: main -> develop (work) -> staging (integration) -> release (publish) -> main
# develop/staging/release branches now exist (created off main) so `taskit
# flow auto` can run the full pipeline.
[flow]
main = "main"
develop = "develop"
staging = "staging"
release = "release"

[release]
# github_repo = "owner/repo"  # auto-detected from git remote
publish_order = [
  "tracers-core",
  "tracers-agent",
  "tracers-task",
  "tracers-runtime",
]
# skip_docs   = false  # skip `cargo doc` before publishing
# allow_dirty = false  # publish with uncommitted changes

[output]
default_format = "sarif"
