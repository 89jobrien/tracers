# cargo-deny configuration
# See: embarkstudios.github.io/cargo-deny/

[advisories]
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

# miette pulls unicode-width 0.1.14 directly while its own dependency
# textwrap pulls 0.2.2. Both are in the tree, neither is ours to unify, and
# the duplicate is benign — skipping it keeps `taskit audit` output signal
# rather than a warning everyone learns to ignore. Revisit when miette
# updates its direct dependency.
[[bans.skip]]
crate = "unicode-width"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
