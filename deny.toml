# cargo-deny configuration
# See: embarkstudios.github.io/cargo-deny/

[advisories]
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
# TODO: add a [[bans.skip]] entry for `unicode-width` — miette pulls 0.1.14
# directly while its own dep textwrap pulls 0.2.2, producing a benign but
# persistent duplicate-version warning on every `taskit audit`.

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
