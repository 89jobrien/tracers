[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/core",
    "crates/task",
    "crates/agent",
    "crates/runtime",
    "crates/trace-test",
    "examples",
    "xtask",
]
# cargo-fuzz builds with nightly `-Z` flags; keep it out of the main
# workspace so `cargo build --workspace` on stable never sees it.
exclude = ["fuzz"]

[workspace.package]
# TODO: pin `rust-version` (MSRV) here and add a `taskit inspect`/CI check
# for it — edition 2024 code has a real toolchain floor and nothing
# currently enforces it.
edition     = "2024"
# NOTE: single space around `=` is load-bearing — taskit's version bump
# (taskit-engine/src/patch.rs) matches the literal prefix `version = "`.
version = "0.2.1"
authors     = ["Joseph O'Brien <joseph.obrien@toptal.com>"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/89jobrien/trace-lang"
homepage    = "https://github.com/89jobrien/trace-lang"
keywords    = ["agentic", "tracing", "task-management", "observability"]
categories  = ["development-tools", "asynchronous"]

# TODO: add `[package.metadata.docs.rs]` + docs.rs badges per crate README —
# none of the four publishable crates have either right now.

[workspace.dependencies]
serde       = { version = "1.0.210", features = ["derive"] }
# `float_roundtrip` is not optional here despite being off by default:
# without it serde_json's fast float parser loses an ULP on some
# extreme-exponent f64s, so a `confidence` or `dollars` value drifts a
# little on every checkpoint save/load cycle. Found by the
# `trace_roundtrip` fuzz target; guarded by a unit test in
# crates/core/src/trace.rs.
serde_json  = { version = "1.0.128", features = ["float_roundtrip"] }
uuid        = { version = "=1.10.0", features = ["v4", "serde"] }
chrono      = { version = "=0.4.38", features = ["serde"] }
thiserror   = "=1.0.64"
tokio       = { version = "=1.44.2", features = ["full"] }
async-trait = "=0.1.83"
futures     = "=0.3.30"
proptest    = "=1.11.0"
clap        = { version = "4.5", features = ["derive"] }
