[workspace]
resolver = "2"
members = [
    "crates/trace-core",
    "crates/trace-task",
    "crates/trace-agent",
    "crates/trace-runtime",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["Joe O'Brien <joe@89jobrien.dev>"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/89jobrien/trace-lang"
homepage    = "https://github.com/89jobrien/trace-lang"
keywords    = ["agentic", "tracing", "task-management", "observability"]
categories  = ["development-tools", "asynchronous"]

[workspace.dependencies]
serde       = { version = "=1.0.210", features = ["derive"] }
serde_json  = "=1.0.128"
uuid        = { version = "=1.10.0", features = ["v4", "serde"] }
chrono      = { version = "=0.4.38", features = ["serde"] }
thiserror   = "=1.0.64"
tokio       = { version = "=1.40.0", features = ["full"] }
async-trait = "=0.1.83"
futures     = "=0.3.30"
